[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/validar"
  to = "/.netlify/functions/validar"
  status = 200

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

[[redirects]]
  from = "/api/aviso-preventa"
  to = "/.netlify/functions/aviso-preventa-admin"
  status = 200

[[redirects]]
  from = "/api/baja"
  to = "/.netlify/functions/baja"
  status = 200

[[redirects]]
  from = "/api/pedido"
  to = "/.netlify/functions/pedido"
  status = 200
